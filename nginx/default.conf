# Portfolio — nginx site config (Phase 1: static only).
# Mounted/copied to /etc/nginx/conf.d/default.conf in the image.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip ---------------------------------------------------------------
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;

    # security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com; style-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com; base-uri 'self'; frame-ancestors 'self'" always;

    # static site ----------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # long-cache immutable-ish assets
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # generated data + entry doc: always revalidate
    location = /data/projects.json {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------
    # PHASE 2 — reverse proxy to the backend API. Uncomment when the
    # `api` service exists in docker-compose.yml, and flip the flags in
    # site/js/config.js (API_BASE = "/api", features.* = true).
    # ---------------------------------------------------------------
    # location /api/ {
    #     proxy_pass         http://api:8000/;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
